<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lantern Capital</title>
<meta name="description" content="Lantern Capital is a fund built to be the trusted bridge to Asia for global deep tech and biotech founders.">
<meta property="og:title" content="Lantern Capital">
<meta property="og:description" content="Lantern Capital is a fund built to be the trusted bridge to Asia for global deep tech and biotech founders.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lantern.capital">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0805;
    --cream:#f4ede3;
    --cream-soft:rgba(248,238,218,.72);
    --gold-2:#f7dda0;
    --mono:'Space Mono',ui-monospace,monospace;
    --body:'Archivo',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--void);color:var(--cream);
    font-family:var(--body);font-weight:400;line-height:1.6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  .splash{
    position:relative;height:100vh;height:100svh;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .splash-void{
    position:absolute;inset:0;
    background:radial-gradient(58% 52% at 50% 45%,#2a1a12 0,#1a1108 44%,#0c0806 78%,#070403 100%);
  }
  .splash-void:after{
    content:"";position:absolute;pointer-events:none;
    left:50%;top:45%;transform:translate(-50%,-50%);
    width:min(84vw,500px);height:min(82vh,820px);
    background:url(ink-lantern.jpg) 50%/contain no-repeat;
    opacity:.15;filter:invert(1) sepia(.45);mix-blend-mode:screen;
  }
  .ff{position:absolute;pointer-events:none;border-radius:50%;background:var(--gold-2)}

  .splash-riser{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;will-change:transform}
  .glow-outer{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(900px,90vw);height:min(900px,90vw);border-radius:50%;
    background:radial-gradient(circle,rgba(233,175,95,.28) 0,rgba(206,120,60,.13) 34%,rgba(0,0,0,0) 66%);
    filter:blur(4px);animation:glowPulse 7s ease-in-out infinite;pointer-events:none;
  }
  .splash-float{position:relative;animation:floatY 6.5s ease-in-out infinite;will-change:transform}
  .glow-inner{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(480px,70vw);height:min(480px,70vw);border-radius:50%;
    background:radial-gradient(circle,rgba(250,214,140,.5) 0,rgba(236,150,80,.34) 26%,rgba(150,50,34,.18) 50%,rgba(0,0,0,0) 72%);
    animation:glowSoft 5s ease-in-out infinite;pointer-events:none;
  }
  .splash-lantern{
    position:relative;display:block;width:94px;height:127px;fill:#fcfaf4;
    filter:drop-shadow(0 0 13px rgba(244,140,96,.92)) drop-shadow(0 0 36px rgba(212,78,52,.62)) drop-shadow(0 0 82px rgba(150,44,30,.55));
  }
  .splash-wordmark{position:absolute;left:0;right:0;top:calc(50% + 98px);text-align:center;z-index:2;padding:0 24px}
  .sw1{font-family:var(--mono);font-size:12px;letter-spacing:.42em;color:var(--cream-soft)}
  .tagline{
    max-width:600px;margin:18px auto 0;
    font-family:var(--body);font-weight:300;font-size:15px;line-height:1.75;
    color:rgba(248,238,218,.55);letter-spacing:.01em;
  }

  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  @keyframes glowPulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08)}}
  @keyframes glowSoft{0%,100%{opacity:.62}50%{opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.92}}
  @keyframes driftA{0%{transform:translate(0)}25%{transform:translate(18px,-22px)}50%{transform:translate(-12px,-40px)}75%{transform:translate(14px,-16px)}100%{transform:translate(0)}}
  @keyframes driftB{0%{transform:translate(0)}30%{transform:translate(-20px,-14px)}60%{transform:translate(16px,-30px)}100%{transform:translate(0)}}
  @keyframes driftC{0%{transform:translate(0)}25%{transform:translate(-16px,18px)}55%{transform:translate(20px,6px)}80%{transform:translate(-10px,22px)}100%{transform:translate(0)}}

  @media (max-width:720px){
    .splash-lantern{width:76px;height:103px}
    .splash-wordmark{top:calc(50% + 84px)}
    .tagline{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *,:before,:after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header class="splash" id="top">
  <div class="splash-void"></div>

  <span aria-hidden="true" class="ff" style="left:22%;top:31%;width:3px;height:3px;box-shadow:0 0 9px 2px rgba(247,214,150,.7);animation:driftA 15s ease-in-out 0s infinite,twinkle 3.2s ease-in-out 0s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:31%;top:60%;width:2px;height:2px;box-shadow:0 0 6px 2px rgba(247,214,150,.65);animation:driftB 17s ease-in-out .6s infinite,twinkle 2.9s ease-in-out .6s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:39%;top:42%;width:2px;height:2px;box-shadow:0 0 6px 2px rgba(247,214,150,.65);animation:driftC 14s ease-in-out 1.1s infinite,twinkle 3.5s ease-in-out 1.1s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:47%;top:68%;width:3px;height:3px;box-shadow:0 0 9px 2px rgba(247,214,150,.7);animation:driftA 18s ease-in-out .3s infinite,twinkle 3s ease-in-out .3s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:58%;top:35%;width:2px;height:2px;box-shadow:0 0 6px 2px rgba(247,214,150,.65);animation:driftB 16s ease-in-out 1.4s infinite,twinkle 3.6s ease-in-out 1.4s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:64%;top:57%;width:3px;height:3px;box-shadow:0 0 9px 2px rgba(247,214,150,.7);animation:driftC 19s ease-in-out .8s infinite,twinkle 2.8s ease-in-out .8s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:71%;top:46%;width:2px;height:2px;box-shadow:0 0 6px 2px rgba(247,214,150,.65);animation:driftA 15.5s ease-in-out 2s infinite,twinkle 3.3s ease-in-out 2s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:53%;top:27%;width:2px;height:2px;box-shadow:0 0 6px 2px rgba(247,214,150,.65);animation:driftB 13.5s ease-in-out 1.7s infinite,twinkle 3.1s ease-in-out 1.7s infinite"></span>
  <span aria-hidden="true" class="ff" style="left:44%;top:73%;width:3px;height:3px;box-shadow:0 0 9px 2px rgba(247,214,150,.7);animation:driftC 17.5s ease-in-out .2s infinite,twinkle 3.7s ease-in-out .2s infinite"></span>

  <div class="splash-riser">
    <div class="glow-outer" aria-hidden="true"></div>
    <div class="splash-float">
      <div class="glow-inner" aria-hidden="true"></div>
      <svg class="splash-lantern" viewBox="0 0 43.21 58.59" aria-hidden="true" focusable="false">
        <rect y="26.72" width="13.92" height="5.13"/>
        <rect x="29.29" y="26.73" width="13.92" height="5.13"/>
        <rect x="19.04" width="5.13" height="13.92"/>
        <rect x="13.91" y="44.67" width="5.13" height="13.92"/>
        <rect x="24.17" y="44.67" width="5.13" height="13.92"/>
        <rect y="16.84" width="43.21" height="6.23"/>
        <rect y="35.52" width="43.21" height="6.23"/>
      </svg>
    </div>
  </div>

  <div class="splash-wordmark">
    <div class="sw1">LANTERN CAPITAL</div>
    <p class="tagline">Lantern Capital is a fund built to be the trusted bridge to Asia for global deep&nbsp;tech and biotech founders.</p>
  </div>
</header>

</body>
</html>
